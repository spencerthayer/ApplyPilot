# Workday employer registry for ApplyPilot
# Users can add their own employers by following this pattern.
# Find your employer's Workday URL at: https://[company].wd[N].myworkdayjobs.com

# Canada-only employers removed 2026-06-10 — the pipeline targets Seattle/US
# roles and the scorer terminal-archives non-US-eligible postings, so crawling
# them only burned enrich/score tokens. Removed: TD, CIBC, RBC, BMO, Manulife,
# Sun Life, Desjardins, Intact, Aviva Canada, TMX, Brookfield, CPP Investments,
# OMERS, Ontario Teachers, PSP, CDPQ, HOOPP, AIMCo, BlackBerry, PwC, BDO,
# TELUS International, TELUS Health, Canadian Tire, PC Financial, CAE, Magna,
# MLSE, OLG, Enbridge, Canadian Solar. Recover entries from git history if a
# US-focused board emerges for any of them.

employers:

  # ── US Tech ─────────────────────────────────────────────────────────────

  workday:
    name: Workday
    tenant: workday
    site_id: Workday
    base_url: https://workday.wd5.myworkdayjobs.com
  salesforce:
    name: Salesforce
    tenant: salesforce
    site_id: External_Career_Site
    base_url: https://salesforce.wd12.myworkdayjobs.com
  nvidia:
    name: "NVIDIA"
    tenant: "nvidia"
    site_id: "NVIDIAExternalCareerSite"
    base_url: "https://nvidia.wd5.myworkdayjobs.com"

  # Netflix — disabled 2026-06-10: netflix.wd1 CXS API returns HTTP 422
  # (same death signature as ServiceNow/DocuSign/Uber). Netflix moved to
  # Eightfold; unlike Starbucks/HP, their deployment answers anonymously:
  #   https://explore.jobs.netflix.net/api/apply/v2/jobs?domain=netflix.com
  # → future-scraper candidate, see CLAUDE.md Future Work.

  cisco:
    name: Cisco
    tenant: cisco
    site_id: Cisco_Careers
    base_url: https://cisco.wd5.myworkdayjobs.com
  intel:
    name: Intel
    tenant: intel
    site_id: External
    base_url: https://intel.wd1.myworkdayjobs.com
  adobe:
    name: Adobe
    tenant: adobe
    site_id: external_experienced
    base_url: https://adobe.wd5.myworkdayjobs.com
  motorola:
    name: "Motorola Solutions"
    tenant: "motorolasolutions"
    site_id: "Careers"
    base_url: "https://motorolasolutions.wd5.myworkdayjobs.com"

  ciena:
    name: "Ciena"
    tenant: "ciena"
    site_id: "Careers"
    base_url: "https://ciena.wd5.myworkdayjobs.com"

  # Thomson Reuters removed 2026-04-23 — user is not interested; 327 jobs
  # had been pulled wastefully over prior runs. Existing TR jobs in DB are
  # also blocked at apply-time via ~/.applypilot/company_limits.yaml
  # (thomsonreuters: max_in_flight: 0).

  moderna:
    name: "Moderna"
    tenant: "modernatx"
    site_id: "M_tx"
    base_url: "https://modernatx.wd1.myworkdayjobs.com"

  # ServiceNow / DocuSign / Uber — disabled 2026-05-07 after persistent HTTP 422
  # responses across all search queries. Manual probe confirmed:
  #   - servicenow.wd1.myworkdayjobs.com/ServiceNowCareers → HTTP 500 on UI, 422 on API
  #   - docusign.wd5.myworkdayjobs.com/External           → HTTP 500; DocuSign moved to iCIMS
  #     (uscareers-docusign.icims.com)
  #   - uber.wd5.myworkdayjobs.com/uberCareers            → HTTP 500; Uber pulled the public
  #     Workday tenant. Uber's Greenhouse board (slug "uber") returns 404 too.
  # If any of these tenants comes back online, re-add with the new site_id.

  # ── US Fintech ──────────────────────────────────────────────────────────

  fis:
