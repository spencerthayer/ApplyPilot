# Ashby ATS direct-API employer registry.
#
# Slugs are the tenant part of the public Ashby URL —
# https://jobs.ashbyhq.com/{slug} or
# https://api.ashbyhq.com/posting-api/job-board/{slug}.
#
# Verified 2026-04-26 by probing the posting-api endpoint
# (200 = valid, 404 = wrong slug or no public board).
#
# To add an employer:
#   1. Find their Ashby board URL (jobs.ashbyhq.com/{slug}).
#   2. curl -sIo /dev/null -w '%{http_code}\n' \
#         https://api.ashbyhq.com/posting-api/job-board/{slug}
#      Should be 200.
#   3. Add an entry below.

